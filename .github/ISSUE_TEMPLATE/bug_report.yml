name: Bug report
description: Report a reproducible problem using synthetic or non-sensitive media.
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Leadzy Studio. Do not attach customer footage, API keys, or private project files.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Desktop app
        - Source / browser UI
        - CLI
        - Rendering / FFmpeg
        - Agent integration
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Generate or open...
        2. Choose...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, CPU architecture, Node/pnpm versions, and FFmpeg version when relevant.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed API keys, personal paths, customer footage, and other private data.
          required: true
        - label: This is not a security vulnerability; security reports use SECURITY.md.
          required: true

name: Windows desktop candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          architecture: x64
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.29.1 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm media:setup
      - name: Add prepared media tools to PATH
        run: '"$PWD/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - run: pnpm exec vitest run --no-file-parallelism
      - run: pnpm audit --prod --audit-level high
      - name: Build unsigned candidate
        run: pnpm desktop:make:win --unsigned
      - name: Verify packaged runtime and native tools
        run: node scripts/verify-desktop-package.mjs "out/Leadzy Studio-win32-x64"
      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leadzy-studio-windows-x64-unsigned
          path: out/make/**
          if-no-files-found: error
          retention-days: 14
